name: Go SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    # Enable only after the MOS-940 pool qualification and repository App setup.
    # Unset/false keeps hosted CI; fork pull requests always remain hosted.
    runs-on: ${{ fromJSON(vars.MOSAIC_RUNNER_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","mosaic-runner"]' || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22.x', '1.26.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Format, vet, test, and build
        env:
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build ./...
